name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (Android/JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários e de integração (sem emulador)
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  apk:
    name: APK de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  ios:
    name: Testes no iOS (simulador)
    runs-on: macos-latest
    continue-on-error: true # informativo até o iOS estar estável (Integrante 1 acompanha)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew iosSimulatorArm64Test --stacktrace
