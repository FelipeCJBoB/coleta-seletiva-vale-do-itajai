name: CI

# Roda em TODO push (qualquer branch): assim o vermelho (teste falhando) e o verde (teste passando)
# aparecem na aba Actions a cada commit, e isso é a evidência do TDD. Não usamos o gatilho
# pull_request para não rodar tudo duas vezes. O job de interface (emulador) só roda quando pedido.
on:
  workflow_dispatch:
  push:

jobs:
  testes:
    name: Testes (Android/JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários e de integração (sem emulador)
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --stacktrace
      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

  apk:
    name: APK de teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  ios:
    name: Testes no iOS (simulador)
    runs-on: macos-latest
    continue-on-error: true # informativo até o iOS estar estável (Integrante 1 acompanha)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew iosSimulatorArm64Test --stacktrace

  interface:
    name: Testes de interface (emulador Android)
    # Lento (~10 min): roda só quando pedido em Actions > CI > Run workflow
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Relatório dos testes de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-interface
          path: composeApp/build/reports/androidTests/
          if-no-files-found: ignore
