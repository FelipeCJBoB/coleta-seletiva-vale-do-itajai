# Uso único: gera o Gradle Wrapper (gradlew e gradle-wrapper.jar) e salva no repositório.
# Rodar em Actions > "Gerar Gradle Wrapper" > Run workflow. Depois disso este arquivo não é mais necessário.
name: Gerar Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle wrapper --gradle-version 8.14.3
      - name: Salvar wrapper
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "chore: gradle wrapper 8.14.3" || echo "nada a salvar"
          git push
